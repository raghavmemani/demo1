name: Update Artifact List

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # allowed

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x .github/workflows/update-workflow-options.sh

      - name: Generate artifact list
        run: .github/workflows/update-workflow-options.sh

      - name: Commit artifact list
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update artifact list"
          file_pattern: artifact-list.txt
