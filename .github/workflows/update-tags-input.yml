name: Update Release Tag Inputs

on:
  schedule:
    - cron: "*/1 * * * *"   # Run daily at midnight UTC
  workflow_dispatch:

jobs:
  update-tags:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Required to fetch tags

      # ✅ Install CORRECT yq (mikefarah v4)
      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Fetch recent Git tags
        id: fetch_tags
        run: |
          TAGS_JSON=$(git tag --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n 5 \
            | jq -R . \
            | jq -s .)

          echo "tags=$TAGS_JSON" >> "$GITHUB_OUTPUT"

      - name: Update deploy.yml with dynamic tags
        run: |
          yq -i \
            ".on.workflow_dispatch.inputs.release_tag.options = ${{ steps.fetch_tags.outputs.tags }}" \
            .github/workflows/deploy.yml

      - name: Commit updated workflow
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update release_tag options with recent tags"
          file_pattern: ".github/workflows/deploy.yml"
