name: Update Release Tag Inputs

on:
  push:
    tags:
      - 'v*.*.*'
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-tags:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Fetch recent git tags
        id: tags
        run: |
          TAGS=$(git tag --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n 5)

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update deploy.yml dropdown options
        run: |
          yq eval '
            .on.workflow_dispatch.inputs.release_tag.options =
            (strenv(TAGS) | split("\n"))
          ' -i .github/workflows/deploy.yml
        env:
          TAGS: ${{ steps.tags.outputs.tags }}

      - name: Commit updated workflow
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update release tag dropdown"
          file_pattern: ".github/workflows/deploy.yml"
