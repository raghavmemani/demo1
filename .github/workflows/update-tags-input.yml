name: Update Workflow Options

on:
  schedule:
    - cron: "*/1 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    # 🔑 REQUIRED permissions
    permissions:
      contents: write
      workflows: write

    steps:
      # --------------------------
      # Checkout repository
      # --------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------
      # Debug: Show repo structure
      # --------------------------
      - name: Debug repo files
        run: |
          echo "===== ROOT FILES ====="
          ls -la
          echo "===== WORKFLOWS ====="
          ls -la .github/workflows

      # --------------------------
      # Make script executable
      # --------------------------
      - name: Make update script executable
        run: |
          chmod +x .github/workflows/update-workflow-options.sh
          ls -l .github/workflows/update-workflow-options.sh

      # --------------------------
      # Debug: Show workflow BEFORE
      # --------------------------
      - name: Show test-and-deploy.yml BEFORE
        run: |
          echo "===== BEFORE ====="
          cat .github/workflows/test-and-deploy.yml

      # --------------------------
      # Run your shell script
      # --------------------------
      - name: Run update-workflow-options.sh
        run: |
          echo "===== RUNNING SCRIPT ====="
          .github/workflows/update-workflow-options.sh

      # --------------------------
      # Debug: Show workflow AFTER
      # --------------------------
      - name: Show test-and-deploy.yml AFTER
        run: |
          echo "===== AFTER ====="
          cat .github/workflows/test-and-deploy.yml

      # --------------------------
      # Debug: Show artifact-list.txt
      # --------------------------
      - name: Show artifact-list.txt
        run: |
          echo "===== artifact-list.txt ====="
          cat artifact-list.txt

      # --------------------------
      # Commit changes
      # --------------------------
      - name: Commit updated workflow
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update artifact dropdown options"
          file_pattern: |
            .github/workflows/test-and-deploy.yml
            artifact-list.txt
