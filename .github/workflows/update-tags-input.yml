name: Update Workflow Options

on:
  # Trigger ONLY when pom.xml or the script changes
  push:
    paths:
      - pom.xml
      - .github/workflows/update-workflow-options.sh

  # Optional: allow manual run
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # REQUIRED to push changes

    steps:
      # --------------------------
      # Checkout repository
      # --------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------
      # Debug: Repo structure
      # --------------------------
      - name: Debug repo files
        run: |
          echo "===== ROOT FILES ====="
          ls -la
          echo "===== WORKFLOWS ====="
          ls -la .github/workflows

      # --------------------------
      # Install yq
      # --------------------------
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      # --------------------------
      # Make script executable
      # --------------------------
      - name: Make update script executable
        run: |
          chmod +x .github/workflows/update-workflow-options.sh

      # --------------------------
      # Show workflow BEFORE
      # --------------------------
      - name: Show test-and-deploy.yml BEFORE
        run: |
          echo "===== BEFORE ====="
          cat .github/workflows/test-and-deploy.yml

      # --------------------------
      # Run update script
      # --------------------------
      - name: Run update-workflow-options.sh
        run: |
          .github/workflows/update-workflow-options.sh

      # --------------------------
      # Show workflow AFTER
      # --------------------------
      - name: Show test-and-deploy.yml AFTER
        run: |
          echo "===== AFTER ====="
          cat .github/workflows/test-and-deploy.yml

      # --------------------------
      # Commit only if changes exist
      # --------------------------
      - name: Commit updated workflow
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update artifact dropdown options"
          file_pattern: |
            .github/workflows/test-and-deploy.yml
            artifact-list.txt