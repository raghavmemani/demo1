name: Update Release Tag Inputs

on:
  schedule:
    - cron: "*/1 * * * *"
  workflow_dispatch:

jobs:
  update-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------
      # Install yq binary (v4.x)
      # --------------------------
      - name: Install yq v4
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          echo "YQ Version:"
          yq --version

      # --------------------------
      # Fetch Tags
      # --------------------------
      - name: Fetch recent Git tags
        id: fetch_tags
        run: |
          echo "===== FETCHING TAGS ====="
          git fetch --tags
          echo "All tags in repo:"
          git tag --sort=-v:refname | cat

          TAGS_JSON=$(git tag --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n 5 \
            | jq -R . \
            | jq -s .)

          echo "===== TAGS AS JSON ARRAY ====="
          echo "$TAGS_JSON"

          echo "tags=$TAGS_JSON" >> "$GITHUB_OUTPUT"

      # --------------------------
      # Debug: Raw output
      # --------------------------
      - name: Debug TAG output from previous step
        run: |
          echo "===== RAW TAGS FROM OUTPUT ====="
          echo "${{ steps.fetch_tags.outputs.tags }}"

      # --------------------------
      # Debug: Show deploy.yml BEFORE updating
      # --------------------------
      - name: Show test-and-deploy.yml BEFORE update
        run: |
          echo "===== deploy.yml BEFORE ====="
          cat .github/workflows/test-and-deploy.yml

      # --------------------------
      # Update test-and-deploy.yml using yq
      # --------------------------
      - name: Update test-and-deploy.yml with dynamic tags
        run: |
          echo "===== RUNNING YQ UPDATE ====="
          echo "Tags passed to yq:"
          echo "$tags"

          yq eval \
            '.on.workflow_dispatch.inputs.release_tag.options = env(tags)' \
            -i .github/workflows/test-and-deploy.yml
        env:
          tags: ${{ steps.fetch_tags.outputs.tags }}

      # --------------------------
      # Debug: Show deploy.yml AFTER updating
      # --------------------------
      - name: Show deploy.yml AFTER update
        run: |
          echo "===== deploy.yml AFTER ====="
          cat .github/workflows/deploy.yml

      # --------------------------
      # Commit changed file
      # --------------------------
      - name: Commit updated workflow
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update release_tag options (debug)"
          file_pattern: ".github/workflows/deploy.yml"
