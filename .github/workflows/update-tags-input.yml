name: Update Release Tag Inputs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  update-tags:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # ✅ ONLY valid permission needed

    steps:
      # --------------------------
      # Checkout
      # --------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------
      # Debug repo state
      # --------------------------
      - name: Debug repo files
        run: |
          echo "===== ROOT FILES ====="
          ls -la
          echo "===== WORKFLOWS ====="
          ls -la .github/workflows || true

      # --------------------------
      # Make shell script executable
      # --------------------------
      - name: Make script executable
        run: chmod +x .github/workflows/update-workflow-options.sh

      # --------------------------
      # Run shell script (YOUR LOGIC)
      # --------------------------
      - name: Run update-workflow-options.sh
        run: |
          echo "===== RUNNING SCRIPT ====="
          .github/workflows/update-workflow-options.sh

      # --------------------------
      # Debug changed files
      # --------------------------
      - name: Show git diff
        run: |
          echo "===== GIT DIFF ====="
          git status
          git diff

      # --------------------------
      # Commit changes
      # --------------------------
      - name: Commit updated workflow
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update workflow options (debug)"
          file_pattern: |
            .github/workflows/test-and-deploy.yml
            artifact-list.txt
