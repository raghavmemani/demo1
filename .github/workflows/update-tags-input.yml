name: Update Release Tag Inputs

on:
  schedule:
    - cron: "*/1 * * * *"
  workflow_dispatch:

jobs:
  update-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Install mikefarah/yq v4 (force correct binary) ---
      - name: Install yq (v4)
        run: |
          sudo rm -f /usr/bin/yq /usr/local/bin/yq || true
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      # --- Fetch tags and expose as workflow output ---
      - name: Fetch recent Git tags
        id: fetch_tags
        run: |
          TAGS=$(git tag --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n 5 \
            | jq -R . \
            | jq -s .)

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Fetched tags: $TAGS"

      # --- Update deploy.yml safely ---
      - name: Update deploy.yml with dynamic tags
        env:
          TAGS: ${{ steps.fetch_tags.outputs.tags }}
        run: |
          yq eval \
            '.on.workflow_dispatch.inputs.release_tag.options = env(TAGS)' \
            -i .github/workflows/deploy.yml

      # --- Commit changes ---
      - name: Commit updated workflow
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update release_tag options"
          file_pattern: ".github/workflows/deploy.yml"
