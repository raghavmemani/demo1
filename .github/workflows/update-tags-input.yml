# .github/workflows/update-tags-input.yml
name: Update Release Tag Inputs
on:
  schedule:
    - cron: "0 0 * * *"  # Run daily at midnight UTC
  workflow_dispatch:  # Allow manual triggering if needed

jobs:
  update-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history to get tags

      - name: Install dependencies (yq)
        run: |
          # Install yq (YAML parser) to edit the workflow file
          sudo apt update && sudo apt install -y yq

      - name: Fetch recent Git tags
        id: fetch_tags
        run: chmod +x .github/workflows/update-workflow-options.sh


      - name: Update deploy.yml with dynamic tags
        run: |
          # Use yq to overwrite the 'options' array in deploy.yml
          yq eval ".on.workflow_dispatch.inputs.release_tag.options = ${{ steps.fetch_tags.outputs.TAGS }}" -i .github/workflows/deploy.yml

      - name: Commit updated workflow
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update release_tag options with recent tags"
          file_pattern: ".github/workflows/deploy.yml"