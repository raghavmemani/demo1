name: Update Release Tag Inputs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  update-tags:
    runs-on: ubuntu-latest

    # 🔥 REQUIRED PERMISSIONS (THIS FIXES YOUR ERROR)
    permissions:
      contents: write
      workflows: write

    steps:
      # --------------------------
      # Checkout repository
      # --------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------
      # Debug repo structure
      # --------------------------
      - name: Debug repo files
        run: |
          echo "===== ROOT FILES ====="
          ls -la
          echo "===== WORKFLOWS ====="
          ls -la .github/workflows || true

      # --------------------------
      # Make shell script executable
      # --------------------------
      - name: Make script executable
        run: chmod +x .github/workflows/update-workflow-options.sh

      # --------------------------
      # Run YOUR shell script (UNCHANGED)
      # --------------------------
      - name: Run update-workflow-options.sh
        run: |
          echo "===== RUNNING SCRIPT ====="
          .github/workflows/update-workflow-options.sh

      # --------------------------
      # Debug output files
      # --------------------------
      - name: Debug artifact list
        run: |
          echo "===== artifact-list.txt ====="
          cat artifact-list.txt || echo "artifact-list.txt not found"

      # --------------------------
      # Debug git diff
      # --------------------------
      - name: Show git diff
        run: |
          echo "===== GIT STATUS ====="
          git status
          echo "===== GIT DIFF ====="
          git diff

      # --------------------------
      # Commit changes
      # --------------------------
      - name: Commit updated workflow
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update workflow options (debug)"
          file_pattern: |
            .github/workflows/test-and-deploy.yml
            artifact-list.txt
