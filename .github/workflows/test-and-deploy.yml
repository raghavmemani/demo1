name: Spring Boot Test & Deploy Pipeline

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: "kafka | postgres | full"
        required: true
        default: full
        type: choice
        options:
          - kafka
          - postgres
          - full

env:
  KUBE_NAMESPACE: dev
  APP_NAME: hello-app

jobs:
  setup-and-test:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # 1. Checkout code
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # 2. Setup kubectl
      # -----------------------------
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      # -----------------------------
      # 3. Setup Helm
      # -----------------------------
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      # -----------------------------
      # 4. Configure kubeconfig
      # -----------------------------
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      # -----------------------------
      # 5. Create namespace if missing
      # -----------------------------
      - name: Create namespace
        run: |
          kubectl create namespace $KUBE_NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

      # -----------------------------
      # 6. Install Kafka (optional)
      # -----------------------------
      - name: Install Kafka
        if: github.event.inputs.test_type == 'kafka' || github.event.inputs.test_type == 'full'
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm upgrade --install kafka bitnami/kafka \
            --namespace $KUBE_NAMESPACE

      # -----------------------------
      # 7. Install Postgres (optional)
      # -----------------------------
      - name: Install Postgres
        if: github.event.inputs.test_type == 'postgres' || github.event.inputs.test_type == 'full'
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm upgrade --install postgres bitnami/postgresql \
            --namespace $KUBE_NAMESPACE \
            --set auth.postgresPassword=postgres

      # -----------------------------
      # 8. Deploy Application via Helm
      # -----------------------------
      - name: Deploy Hello App
        run: |
          helm upgrade --install $APP_NAME ./helm/hello-app \
            --namespace $KUBE_NAMESPACE

      # -----------------------------
      # 9. Wait for app readiness
      # -----------------------------
      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/$APP_NAME \
            -n $KUBE_NAMESPACE \
            --timeout=120s

      # -----------------------------
      # 10. Run integration tests (K8s Job)
      # -----------------------------
      - name: Run API Tests
        run: |
          kubectl apply -f helm/hello-app/templates/job-test.yaml -n $KUBE_NAMESPACE
          kubectl wait \
            --for=condition=complete \
            job/hello-test \
            -n $KUBE_NAMESPACE \
            --timeout=120s

      # -----------------------------
      # 11. Fetch test logs
      # -----------------------------
      - name: Get test logs
        if: always()
        run: |
          kubectl logs job/hello-test -n $KUBE_NAMESPACE || true

      # -----------------------------
      # 12. Cleanup (ALWAYS)
      # -----------------------------
      - name: Cleanup resources
        if: always()
        run: |
          kubectl delete job hello-test -n $KUBE_NAMESPACE || true
          helm uninstall kafka -n $KUBE_NAMESPACE || true
          helm uninstall postgres -n $KUBE_NAMESPACE || true
