name: Maven Artifact Selector (Shell Based)

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "ArtifactId from pom.xml (example: lombok | spring-boot-starter-web | all)"
        required: true
        type: string
        default: all

jobs:
  artifact-validation:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------
      # 1. Checkout repository
      # -----------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------
      # 2. Extract artifactIds from pom.xml
      # -----------------------------------
      - name: Parse pom.xml using shell
        id: parse-pom
        run: |
          echo "🔍 Parsing pom.xml for artifactIds..."

          ARTIFACT_IDS=$(grep -oP '(?<=<artifactId>).*?(?=</artifactId>)' pom.xml \
            | grep -vE 'spring-boot-starter-parent|maven|plugin' \
            | sort -u)

          if [ -z "$ARTIFACT_IDS" ]; then
            echo "❌ No artifactIds found in pom.xml"
            exit 1
          fi

          echo "📦 Available artifactIds:"
          echo "$ARTIFACT_IDS"

          echo "ARTIFACT_IDS<<EOF" >> $GITHUB_ENV
          echo "$ARTIFACT_IDS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # -----------------------------------
      # 3. Validate user input
      # -----------------------------------
      - name: Validate artifact input
        run: |
          INPUT="${{ github.event.inputs.artifact_id }}"

          echo "🧑 User input: $INPUT"

          if [ "$INPUT" = "all" ]; then
            echo "✅ 'all' selected — using all artifacts"
            echo "SELECTED_ARTIFACTS<<EOF" >> $GITHUB_ENV
            echo "$ARTIFACT_IDS" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            exit 0
          fi

          if echo "$ARTIFACT_IDS" | grep -w "$INPUT" >/dev/null; then
            echo "✅ Artifact '$INPUT' found"
            echo "SELECTED_ARTIFACTS=$INPUT" >> $GITHUB_ENV
          else
            echo "❌ Invalid artifactId: $INPUT"
            echo "Valid artifactIds are:"
            echo "$ARTIFACT_IDS"
            exit 1
          fi

      # -----------------------------------
      # 4. Use selected artifact(s)
      # -----------------------------------
      - name: Use selected artifact(s)
        run: |
          echo "🚀 Final artifact selection:"
          echo "$SELECTED_ARTIFACTS"

          # Example usage:
          for artifact in $SELECTED_ARTIFACTS; do
            echo "➡ Processing artifact: $artifact"
            # place your logic here
          done
