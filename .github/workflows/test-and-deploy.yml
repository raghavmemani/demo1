name: Deploy Release
permissions:
  contents: write
  actions: write


on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Select the release tag to deploy (auto-updated)"
        required: true
        type: choice
        options: []


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Deploy
        run: |
          echo "🚀 Deploying release: ${{ github.event.inputs.release_tag }}"
