name: Deploy Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Select the release tag to deploy (auto-updated)"
        required: true
        type: choice
        options: []   # auto-filled by updater workflow

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Deploy
        run: |
          echo "🚀 Deploying tag ${{ github.event.inputs.release_tag }}"
