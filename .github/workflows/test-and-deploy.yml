name: Reusable Maven Deploy Workflow

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "Select the artifact to build and deploy"
        required: true
        type: choice
        options: [build-helper-maven-plugin
          demo1
          graphqlcodegen-maven-plugin
          lombok
          maven-compiler-plugin
          maven-javadoc-plugin
          native-maven-plugin
          raghav
          spring-boot-configuration-processor
          spring-boot-devtools
          spring-boot-docker-compose
          spring-boot-maven-plugin
          spring-boot-starter-parent
          spring-boot-starter-test
          spring-boot-starter-web
          spring-modulith-bom1
          spring-modulith-starter-core
          spring-modulith-starter-test]

jobs:
  build:
    uses: raghavmemani/central_repository12/.github/workflows/maven.yml@main
    with:
      artifact_id: ${{ inputs.artifact_id }}